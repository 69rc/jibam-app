<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>You're Offline - Jibam Pharmacy</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: linear-gradient(135deg, #0D1B5E 0%, #1A2E8A 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .offline-container {
      text-align: center;
      color: white;
      max-width: 400px;
      width: 100%;
    }
    
    .offline-icon {
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 30px;
      backdrop-filter: blur(10px);
    }
    
    .offline-icon svg {
      width: 60px;
      height: 60px;
      color: #00AEEF;
    }
    
    h1 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 16px;
      letter-spacing: -0.5px;
    }
    
    p {
      font-size: 16px;
      line-height: 1.6;
      opacity: 0.9;
      margin-bottom: 32px;
    }
    
    .retry-button {
      background: #00AEEF;
      color: white;
      border: none;
      padding: 16px 32px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(0, 174, 239, 0.3);
    }
    
    .retry-button:hover {
      background: #0090CC;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 174, 239, 0.4);
    }
    
    .retry-button:active {
      transform: translateY(0);
    }
    
    .cache-info {
      margin-top: 40px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }
    
    .cache-info h3 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #00AEEF;
    }
    
    .cache-info ul {
      list-style: none;
      text-align: left;
    }
    
    .cache-info li {
      font-size: 13px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .cache-info li:last-child {
      border-bottom: none;
    }
    
    .cache-info li::before {
      content: '✓';
      color: #00AEEF;
      font-weight: bold;
    }
    
    .footer {
      margin-top: 40px;
      font-size: 12px;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22"></path>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    
    <h1>You're Offline</h1>
    <p>
      No internet connection detected. Please check your connection and try again.
    </p>
    
    <button class="retry-button" onclick="window.location.reload()">
      Try Again
    </button>
    
    <div class="cache-info">
      <h3>Available Offline</h3>
      <ul>
        <li>Previously viewed pages</li>
        <li>Cached product information</li>
        <li>App interface and layout</li>
        <li>Your browsing history</li>
      </ul>
    </div>
    
    <div class="footer">
      RC: 1948976 | © 2024 Jibam Pharmacy
    </div>
  </div>
  
  <script>
    // Auto-retry when connection is restored
    window.addEventListener('online', () => {
      window.location.reload();
    });
    
    // Show connection status
    function updateConnectionStatus() {
      const isOnline = navigator.onLine;
      console.log('Connection status:', isOnline ? 'online' : 'offline');
    }
    
    window.addEventListener('online', updateConnectionStatus);
    window.addEventListener('offline', updateConnectionStatus);
    
    updateConnectionStatus();
  </script>
</body>
</html>
